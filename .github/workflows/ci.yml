name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The tests are small, and the runners have no GPU.
  JAX_PLATFORMS: cpu

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest --cov=factorem --cov-report=term-missing

  test-minimum:
    name: Test (oldest dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install uv
      - run: uv pip install --system --resolution lowest-direct -e '.[dev]'
      - run: pytest

  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel and run it
        run: |
          python -m pip install dist/*.whl
          factorem --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    # Only what a tag of a version built, once everything else passed.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, test-minimum, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/factorem/
    permissions:
      # For PyPI to trust the workflow, with no token to keep.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Check that the tag is the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "dist/factorem-${version}.tar.gz"
          test -f "dist/factorem-${version}-py3-none-any.whl"
      - uses: pypa/gh-action-pypi-publish@release/v1
